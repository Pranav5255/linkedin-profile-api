services:
  api:
    build: .
    image: linkedin-profile-api:local
    env_file:
      - path: .env
        required: false
    environment:
      CACHE_DATABASE_PATH: /data/cache.db
      CAPTURED_ENDPOINTS_PATH: /data/captured-endpoints.json
    volumes:
      - profile_cache:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  caddy:
    image: caddy:2.9-alpine
    env_file:
      - path: .env
        required: false
    environment:
      DUCKDNS_HOSTNAME: ${DUCKDNS_HOSTNAME:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  profile_cache:
  caddy_data:
  caddy_config:
