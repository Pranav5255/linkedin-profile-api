[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "linkedin-profile-api"
version = "0.1.0"
description = "Hosted API that resolves a LinkedIn profile URL to structured JSON over reverse-engineered Voyager HTTP endpoints."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Pranav5255", email = "pranavmetil@gmail.com" }]
dependencies = [
    "fastapi>=0.115.6,<0.116",
    "uvicorn[standard]>=0.34.0,<0.35",
    "pydantic-settings>=2.7.1,<3",
    "curl_cffi==0.13.0",
    "aiosqlite>=0.21.0,<0.22",
]

[project.scripts]
linkedin-profile-api = "linkedin_profile_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_profile_api"]

[tool.hatch.build.targets.wheel.sources]
"src/linkedin_profile_api" = "linkedin_profile_api"
