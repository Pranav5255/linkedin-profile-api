# Extra nginx server when 80/443 are already used by another site.
# Replace every YOUR_DUCKDNS_HOST, then:
#   sudo certbot --nginx -d YOUR_DUCKDNS_HOST
# Certbot will add the 443 listen and redirect.
#
# Proxies to the API on 127.0.0.1:8080.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DUCKDNS_HOST;

    client_max_body_size 1M;
    large_client_header_buffers 4 16k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 360s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
    send_timeout 360s;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
